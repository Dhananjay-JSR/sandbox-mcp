[project]
name = "sandbox-mcp"
version = "0.1.0"
description = "An MCP server that gives AI coding agents disposable, isolated Docker sandboxes to experiment in."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Dhananjay" }]
keywords = ["mcp", "docker", "sandbox", "ai-agents", "llm", "isolation"]

dependencies = [
    "fastmcp>=2.10",
    "docker>=7.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-docker",
]

[project.scripts]
sandbox-mcp = "sandbox_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/Dhananjay-JSR/sandbox-mcp"
Repository = "https://github.com/Dhananjay-JSR/sandbox-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a live Docker daemon (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Fixture projects for the demos. One of them is deliberately broken; linting
# them to library standards would defeat their purpose.
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["sandbox_mcp"]
mypy_path = "src"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
